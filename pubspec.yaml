name: christmas_firestore_app
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.17.5 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  build_runner: ^2.1.11 
  web_socket_channel: ^3.0.1
  uuid: ^4.5.1
  provider: ^6.1.5+1
  window_manager: ^0.4.3
  process_run: ^1.2.2+1
  firebase_core: ^4.3.0
  pretty_qr_code: ^3.5.0
  google_fonts: ^6.3.0
  cloud_firestore: ^6.1.1
  universal_html: ^2.3.0
  firebase_database: ^12.1.1
  shared_preferences: ^2.5.3
  firebase_ui_database: 
    path: ./firebase_ui_database-2.0.1-hijack/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
